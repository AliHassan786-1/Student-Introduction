<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Introduction</title>
</head>
<body>

    <script>
        // 1. Store student's information in variables
        var studentName = "Ali Khan";   // String
        var age = 16;                   // Number
        var studentClass = "10th";     // String
        var city = "Karachi";           // String

        // 2. Display individual information using alert()
        alert("Student Name: " + studentName);
        alert("Age: " + age);
        alert("Class: " + studentClass);
        alert("City: " + city);

        // 3. Display a combined welcome message using concatenation
        var welcomeMessage = "Welcome, " + studentName + "! You are " + age + " years old, studying in class " + studentClass + ", and you live in " + city + ".";
        
        alert(welcomeMessage);
    </script>

</body>
</html>
